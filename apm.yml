name: wordpress-to-static-migration
version: 1.0.0
description: |
  WordPress サイトを静的サイトジェネレーター (Astro 推奨) + Cloudflare Pages へ移行する際の
  チェックリストと地雷集。WP REST API による抽出、画像移行、URL 保持、リダイレクト戦略、
  Astro Content Collections の slug 予約名や @astrojs/sitemap 互換性などの既知の地雷への
  対処を提供する。
